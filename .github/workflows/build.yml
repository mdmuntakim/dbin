name: build

# dbin is a native project: every supported ABI is built and executed here.
# The Android job exists because a glibc static aarch64 binary dies on Termux
# with SIGSYS (signal 31) - glibc calls rseq(2) at startup and the Android app
# seccomp allowlist does not contain it.  The gate fails if that regression
# comes back.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: linux-x86_64 static + round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build static binary
        run: make static
      - name: Round-trip gate
        run: bash tests/roundtrip.sh
      - name: Check the binary is static
        run: |
          file dbin
          if readelf -d dbin | grep -q '(NEEDED)'; then
            echo "dbin is not static"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dbin-linux-x86_64
          path: dbin

  linux-aarch64:
    name: linux-aarch64 static cross build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler and qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user
      - name: Build
        run: make linux-aarch64
      - name: Execute under qemu-aarch64
        run: |
          qemu-aarch64 ./dbin-linux-aarch64 --json --outdir /tmp/o ./dbin-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: dbin-linux-aarch64
          path: dbin-linux-aarch64

  android:
    name: android arm64-v8a, armeabi-v7a, x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
      - name: Build every Android ABI
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME is not set on this runner" >&2
            exit 1
          fi
          make android
          file dbin-android-aarch64 dbin-android-armv7a dbin-android-x86_64
      - name: Execute every ABI, verify seccomp safety, round-trip
        run: bash tests/android-abi.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dbin-android
          path: |
            dbin-android-aarch64
            dbin-android-armv7a
            dbin-android-x86_64
